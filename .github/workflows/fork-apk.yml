name: Fork APK

# Builds an installable plainDebug APK for personal forks. Upstream CI
# (android.yml) covers tests and the signed production flavors.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plain-debug-apk:
    if: github.repository != 'yukuku/androidbible'
    runs-on: ubuntu-latest

    steps:
      # Full history: the build derives the dev version name's counter from
      # `git rev-list --count HEAD`, which a shallow clone reports as 1.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      # Every runner would otherwise generate its own debug key, and Android
      # refuses to update an installed app with an APK signed by another key.
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assemblePlainDebug \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/.github/fork-debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      # An APK signed with any other key installs as a new app or fails to update the old one, so
      # a wrong key fails the build instead of producing an artifact that cannot be installed.
      - name: Verify signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          apk="$(ls Alkitab/build/outputs/apk/plain/debug/*.apk | head -1)"
          expected="$(keytool -list -v -keystore .github/fork-debug.keystore -storepass android | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z')"
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          echo "expected $expected"
          echo "actual   $actual"
          test -n "$expected" && test "$expected" = "$actual"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: plain-debug-apk
          path: Alkitab/build/outputs/apk/plain/debug/*.apk
          if-no-files-found: error
          retention-days: 14
